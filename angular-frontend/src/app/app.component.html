<div class="flex h-screen w-screen bg-gray-100 overflow-auto">
  <!-- Sidemenu -->
  <aside
    class="h-full w-64 bg-omni-schwarz-700 text-white flex flex-col p-4 gap-8 rounded-r-lg">
    <img src="logo/OmnAIScope-logo-weiss.png" alt="OmnAIScope Logo" />
  </aside>

  <!-- Main content -->
  <main class="flex-1 flex flex-col p-4 gap-4">

    <!-- Graph-Container -->
    <div
      class="w-full flex flex-1 flex-shrink bg-white shadow-md rounded-md p-4 justify-start items-center overflow-auto">
      @let dataSet = dataService.limitedData() | keyvalue;
      @defer (when dataSet.length > 0; on idle) {
        <app-graph [dataSeries]="dataService.limitedData()" [colors]="dataService.curveColors()"></app-graph>
      } @loading {
        <p class="text-gray-500">Warte auf Daten...</p>
      } @error {
        <p class="text-red-500">Fehler beim Laden der Daten.</p>
      }
    </div>
    <div
      class="w-full flex flex-1 flex-shrink bg-white shadow-md rounded-md p-4 justify-start items-center overflow-auto">
      <app-device-selection class="size-full" #devices />
    </div>
  </main>
</div>
